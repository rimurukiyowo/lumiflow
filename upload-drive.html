<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subfolder Image Counter</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --border: #334155;
      --image-color: #34d399;
      --folder-color: #fbbf24;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      margin: 0;
    }

    .container {
      width: 100%;
      max-width: 950px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 6px 0;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 14px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background: #0b1120;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
    }

    .btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 15px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      font-size: 13px;
      color: #fbbf24;
      text-align: center;
      margin-top: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
    }

    .stat-val {
      font-size: 24px;
      font-weight: 700;
      color: #60a5fa;
    }

    .stat-val.highlight-image {
      color: var(--image-color);
    }

    .stat-lbl {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 4px;
    }

    .table-tools {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .table-container {
      max-height: 520px;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th {
      background: #0b1120;
      color: var(--text-muted);
      padding: 12px 14px;
      position: sticky;
      top: 0;
      z-index: 1;
      border-bottom: 1px solid var(--border);
      user-select: none;
      cursor: pointer;
    }

    th:hover {
      color: #fff;
    }

    th.no-sort {
      cursor: default;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    .folder-title {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-count {
      background: rgba(52, 211, 153, 0.15);
      color: var(--image-color);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .badge-empty {
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .link-btn {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    .link-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="header">
      <h1>Deteksi Jumlah Gambar Per Subfolder</h1>
      <p>Data langsung diurutkan otomatis berdasarkan nama folder (A-Z / 1-10)</p>
    </div>

    <div class="card">
      <div class="form-group">
        <label for="folderInput">Link atau ID Folder Utama Google Drive</label>
        <input type="text" id="folderInput" placeholder="Tempel link folder utama di sini...">
      </div>
      <button id="scanBtn" class="btn" onclick="startScan()">Hitung Gambar Tiap Subfolder</button>
      <div id="status" class="status"></div>
    </div>

    <div id="results" class="card" style="display: none;">
      <div class="grid">
        <div class="stat-box">
          <div id="totalFoldersCount" class="stat-val">0</div>
          <div class="stat-lbl">Total Subfolder</div>
        </div>
        <div class="stat-box">
          <div id="totalImagesCount" class="stat-val highlight-image">0</div>
          <div class="stat-lbl">Total Gambar</div>
        </div>
        <div class="stat-box">
          <div id="totalSizeCount" class="stat-val">0 MB</div>
          <div class="stat-lbl">Total Ukuran Gambar</div>
        </div>
      </div>

      <div class="table-tools">
        <span style="font-size: 13px; color: var(--text-muted);">Klik judul kolom untuk ubah urutan sortir</span>
        <input type="text" id="searchBox" placeholder="Cari nama folder..." oninput="handleSearch()"
          style="width: 220px; padding: 6px 10px; font-size: 12px; border-radius: 6px;">
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th onclick="changeSort('name')">Nama Folder <span id="sort-name">▲</span></th>
              <th onclick="changeSort('imageCount')">Jumlah Gambar <span id="sort-imageCount"></span></th>
              <th onclick="changeSort('otherCount')">Total File Lain <span id="sort-otherCount"></span></th>
              <th onclick="changeSort('imageSize')">Ukuran Gambar <span id="sort-imageSize"></span></th>
              <th class="no-sort">Aksi</th>
            </tr>
          </thead>
          <tbody id="folderTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // MASUKKAN API KEY LENGKAP MILIKMU DI SINI
    const GOOGLE_API_KEY = 'AIzaSyC6qH2ELD6bpDuccwkffScYX_irPI1ZvAs';

    let globalReports = [];
    let currentSort = { key: 'name', asc: true };

    function extractFolderId(input) {
      const trimmed = input.trim();
      const match = trimmed.match(/folders\/([a-zA-Z0-9_-]+)/);
      return match ? match[1] : trimmed.split('?')[0];
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function isImageMime(mime) {
      return mime.startsWith('image/') ||
        mime.includes('jpeg') ||
        mime.includes('png') ||
        mime.includes('webp') ||
        mime.includes('gif');
    }

    async function fetchFolderContents(folderId) {
      let pageToken = null;
      const items = [];

      do {
        const query = encodeURIComponent(`'${folderId}' in parents and trashed = false`);
        let url = `https://www.googleapis.com/drive/v3/files?q=${query}&key=${GOOGLE_API_KEY}&pageSize=1000&fields=nextPageToken,files(id,name,mimeType,size,webViewLink)`;
        if (pageToken) url += `&pageToken=${pageToken}`;

        const res = await fetch(url);
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        if (data.files) items.push(...data.files);
        pageToken = data.nextPageToken;
      } while (pageToken);

      return items;
    }

    async function startScan() {
      const rawFolder = document.getElementById('folderInput').value.trim();
      const rootFolderId = extractFolderId(rawFolder);
      const statusEl = document.getElementById('status');
      const scanBtn = document.getElementById('scanBtn');

      if (!rootFolderId) {
        statusEl.innerText = 'Masukkan link atau ID folder terlebih dahulu.';
        return;
      }

      scanBtn.disabled = true;
      statusEl.innerText = 'Membaca daftar subfolder...';
      document.getElementById('results').style.display = 'none';

      try {
        const rootItems = await fetchFolderContents(rootFolderId);
        const subfolders = rootItems.filter(item => item.mimeType === 'application/vnd.google-apps.folder');

        const rootImages = rootItems.filter(item => isImageMime(item.mimeType));
        const rootOtherFiles = rootItems.filter(item => !isImageMime(item.mimeType) && item.mimeType !== 'application/vnd.google-apps.folder');
        const rootImgSize = rootImages.reduce((sum, item) => sum + (Number(item.size) || 0), 0);

        globalReports = [];

        if (rootImages.length > 0 || rootOtherFiles.length > 0) {
          globalReports.push({
            name: '(Root / Luar Subfolder)',
            isRoot: true,
            imageCount: rootImages.length,
            otherCount: rootOtherFiles.length,
            imageSize: rootImgSize,
            link: `https://drive.google.com/drive/folders/${rootFolderId}`
          });
        }

        let overallImages = rootImages.length;
        let overallSize = rootImgSize;

        for (let i = 0; i < subfolders.length; i++) {
          const folder = subfolders[i];
          statusEl.innerText = `Memindai (${i + 1}/${subfolders.length}): ${folder.name}...`;

          const contents = await fetchFolderContents(folder.id);

          let imgCount = 0;
          let otherCount = 0;
          let imgSize = 0;

          contents.forEach(file => {
            if (isImageMime(file.mimeType)) {
              imgCount++;
              imgSize += (Number(file.size) || 0);
            } else if (file.mimeType !== 'application/vnd.google-apps.folder') {
              otherCount++;
            }
          });

          overallImages += imgCount;
          overallSize += imgSize;

          globalReports.push({
            name: folder.name,
            isRoot: false,
            imageCount: imgCount,
            otherCount: otherCount,
            imageSize: imgSize,
            link: folder.webViewLink || `https://drive.google.com/drive/folders/${folder.id}`
          });
        }

        // Set urutan awal: Berdasarkan nama folder (A-Z, natural numeric)
        currentSort = { key: 'name', asc: true };
        sortData();

        document.getElementById('totalFoldersCount').innerText = subfolders.length.toLocaleString('id-ID');
        document.getElementById('totalImagesCount').innerText = overallImages.toLocaleString('id-ID');
        document.getElementById('totalSizeCount').innerText = formatBytes(overallSize);

        renderTable(globalReports);

        statusEl.innerText = 'Pemindaian selesai!';
        document.getElementById('results').style.display = 'block';
      } catch (err) {
        statusEl.innerText = 'Gagal: ' + err.message;
      } finally {
        scanBtn.disabled = false;
      }
    }

    function sortData() {
      globalReports.sort((a, b) => {
        // Root folder tetap ditaruh paling atas
        if (a.isRoot) return -1;
        if (b.isRoot) return 1;

        let result = 0;
        if (currentSort.key === 'name') {
          // Natural sort agar urutan "Folder 2" berada sebelum "Folder 10"
          result = a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
        } else {
          result = a[currentSort.key] - b[currentSort.key];
        }

        return currentSort.asc ? result : -result;
      });

      // Perbarui icon indikator panah sortir di header
      ['name', 'imageCount', 'otherCount', 'imageSize'].forEach(col => {
        const el = document.getElementById(`sort-${col}`);
        if (el) {
          el.innerText = (currentSort.key === col) ? (currentSort.asc ? ' ▲' : ' ▼') : '';
        }
      });
    }

    function changeSort(key) {
      if (currentSort.key === key) {
        currentSort.asc = !currentSort.asc;
      } else {
        currentSort.key = key;
        currentSort.asc = (key === 'name'); // Jika nama default ascending, jika angka default descending bisa diatur di sini
      }
      sortData();
      handleSearch();
    }

    function handleSearch() {
      const q = document.getElementById('searchBox').value.toLowerCase();
      const filtered = globalReports.filter(item => item.name.toLowerCase().includes(q));
      renderTable(filtered);
    }

    function renderTable(reports) {
      const tbody = document.getElementById('folderTableBody');
      tbody.innerHTML = '';

      if (reports.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 20px;">Tidak ada subfolder yang ditemukan.</td></tr>`;
        return;
      }

      reports.forEach(item => {
        const tr = document.createElement('tr');
        const badge = item.imageCount > 0
          ? `<span class="badge-count">${item.imageCount.toLocaleString('id-ID')} Gambar</span>`
          : `<span class="badge-empty">0 Gambar</span>`;

        tr.innerHTML = `
          <td>
            <div class="folder-title">
              <span>📁</span>
              <span>${item.name}</span>
            </div>
          </td>
          <td>${badge}</td>
          <td>${item.otherCount.toLocaleString('id-ID')} file</td>
          <td>${formatBytes(item.imageSize)}</td>
          <td><a href="${item.link}" target="_blank" class="link-btn">Buka Folder ↗</a></td>
        `;
        tbody.appendChild(tr);
      });
    }
  </script>

</body>

</html>
