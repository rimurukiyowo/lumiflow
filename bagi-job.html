<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bagi Job & Drive - Kimi Team</title>

  <link rel="icon" type="image/png" href="./logo.png">
  <meta name="theme-color" content="#0f172a">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.iconify.design/iconify-icon/1.0.8/iconify-icon.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f8fafc;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 24px 24px;
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
  </style>
</head>

<body class="text-slate-700 antialiased min-h-screen flex flex-col">

  <!-- NAVBAR ATAS -->
  <header
    class="bg-white border-b border-slate-200 sticky top-0 z-20 px-6 py-3.5 flex items-center justify-between shadow-2xs">
    <div class="flex items-center gap-3">
      <div
        class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-extrabold text-sm shadow-sm">
        K</div>
      <div>
        <h1 class="text-xs font-extrabold text-slate-900 tracking-tight">Kimi Suite v3.0</h1>
        <p class="text-[10px] text-slate-400">Modul Pembagian Job & Auto Drive</p>
      </div>
    </div>
    <span class="text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full flex items-center gap-1">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Auto Drive Aktif
    </span>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="flex-1 p-4 sm:p-6 max-w-5xl w-full mx-auto space-y-6 my-auto">

    <!-- Grid Layout Utama (2 Kolom) -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- KOLOM KIRI: INPUT DATA & OPSI (7 Kolom) -->
      <div class="lg:col-span-7 space-y-5">

        <!-- 1. Link Folder Induk (Permanen / Paten) -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs space-y-2">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
              <iconify-icon icon="heroicons:folder-open-20-solid" class="text-indigo-600 text-base"></iconify-icon>
              Google Drive Induk (Permanen)
            </label>
            <span class="text-[10px] font-bold bg-indigo-100 text-indigo-800 px-2.5 py-0.5 rounded-full">Paten Terkunci</span>
          </div>
          <div>
            <input type="text" id="folderLinkInput" readonly
              class="w-full p-2.5 text-xs border border-slate-200 rounded-xl bg-slate-100 text-slate-600 font-mono focus:outline-none cursor-not-allowed"
              value="https://drive.google.com/drive/folders/1TjxgPJp_lW1YEaRmseO_UX7K-jifhO-c">
          </div>
        </div>

        <!-- 2. Brief Pesanan -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs space-y-2">
          <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <iconify-icon icon="heroicons:document-text-20-solid" class="text-indigo-600 text-base"></iconify-icon>
            Format Brief Pesanan (Bisa Banyak ID Sekaligus)
          </label>
          <textarea id="briefInput"
            class="w-full h-36 p-3 text-xs border border-slate-200 rounded-xl bg-slate-50 font-mono text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-600 resize-y leading-relaxed"
            placeholder="ID : 287345&#10;Target : https://...&#10;Jumlah : 50&#10;Report :"></textarea>
        </div>

        <!-- 3. PILIH OPSI PEMBAGIAN -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs space-y-2.5">
          <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
            <iconify-icon icon="heroicons:adjustments-horizontal-20-solid"
              class="text-indigo-600 text-base"></iconify-icon>
            Pilih Metode Pembagian Job
          </label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <label
              class="flex items-start gap-2.5 p-3 rounded-xl border border-slate-200 bg-slate-50/50 cursor-pointer hover:border-indigo-400 transition">
              <input type="radio" name="optionMode" value="1" checked
                class="mt-0.5 text-indigo-600 focus:ring-indigo-500">
              <div>
                <span class="text-xs font-extrabold text-slate-800 block">Opsi 1: Semua Kebagian Semua ID</span>
                <span class="text-[10px] text-slate-500 block">Semua talent ikut mengerjakan di setiap ID.</span>
              </div>
            </label>
            <label
              class="flex items-start gap-2.5 p-3 rounded-xl border border-slate-200 bg-slate-50/50 cursor-pointer hover:border-indigo-400 transition">
              <input type="radio" name="optionMode" value="2" class="mt-0.5 text-indigo-600 focus:ring-indigo-500">
              <div>
                <span class="text-xs font-extrabold text-slate-800 block">Opsi 2: Rotasi / ID Berbeda</span>
                <span class="text-[10px] text-slate-500 block">ID disebar bergantian per talent.</span>
              </div>
            </label>
          </div>
        </div>

        <!-- 4. Pilih Anggota Tim -->
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs space-y-3">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
              <iconify-icon icon="heroicons:users-20-solid" class="text-indigo-600 text-base"></iconify-icon>
              Pilih Anggota Tim Tugas Hari Ini
            </label>
            <div class="flex gap-2 text-[11px] font-bold">
              <button onclick="selectAll()" class="text-indigo-600 hover:underline">Semua</button>
              <span class="text-slate-300">|</span>
              <button onclick="deselectAll()" class="text-slate-400 hover:text-slate-600">Batal</button>
            </div>
          </div>

          <!-- Daftar Badge Nama -->
          <div id="nameContainer"
            class="flex flex-wrap gap-1.5 max-h-40 overflow-y-auto p-2.5 border border-slate-100 rounded-xl bg-slate-50">
          </div>

          <div class="flex items-center justify-between text-xs pt-1">
            <span class="text-slate-400 font-medium">Terpilih: <strong id="totalSelected"
                class="text-slate-800">0</strong> Orang</span>
            <div class="flex gap-1.5">
              <input type="text" id="newNameInput"
                class="p-1.5 px-2.5 text-xs border border-slate-200 rounded-lg bg-white" placeholder="Tambah nama..."
                onkeydown="if(event.key === 'Enter') addName()">
              <button onclick="addName()"
                class="bg-slate-900 hover:bg-slate-800 text-white text-xs px-3 py-1.5 rounded-lg font-bold">Tambah</button>
            </div>
          </div>
        </div>

        <!-- Tombol Eksekusi -->
        <div class="flex gap-2 pt-1">
          <button id="btnGenerate" onclick="generateJob()"
            class="flex-1 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white text-xs py-3.5 px-4 rounded-xl font-bold shadow-sm transition flex items-center justify-center gap-1.5">
            <iconify-icon icon="heroicons:sparkles-20-solid" class="text-base"></iconify-icon> <span id="btnGenText">Generate Job & Buat Folder Drive</span>
          </button>
          <button onclick="clearAll()"
            class="bg-slate-100 hover:bg-rose-50 hover:text-rose-600 text-slate-600 text-xs py-3.5 px-4 rounded-xl font-bold border border-slate-200 transition">
            Reset
          </button>
        </div>

      </div>

      <!-- KOLOM KANAN: HASIL REKAP OUTPUT (5 Kolom) -->
      <div class="lg:col-span-5 flex flex-col">
        <div class="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex-1 flex flex-col space-y-3">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
              <iconify-icon icon="heroicons:clipboard-document-list-20-solid"
                class="text-indigo-600 text-base"></iconify-icon>
              Hasil Rekap Output
            </label>
            <span class="text-[10px] font-bold bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded">Siap Kirim WA</span>
          </div>

          <textarea id="outputResult" readonly
            class="w-full flex-1 min-h-[320px] p-3.5 text-xs border border-slate-800 rounded-xl bg-slate-900 text-indigo-300 font-mono focus:outline-none leading-relaxed resize-y"
            placeholder="# Hasil rekap akan muncul di sini..."></textarea>

          <button onclick="copyToClipboard()"
            class="w-full bg-slate-900 hover:bg-slate-800 active:scale-95 text-white text-xs py-3 rounded-xl font-bold transition flex items-center justify-center gap-1.5 shadow-xs">
            <iconify-icon icon="heroicons:clipboard-document-check-20-solid" class="text-base"></iconify-icon>
            <span id="btnCopyText">Salin Teks Rekapan</span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="text-center py-4 text-xs text-slate-400 border-t border-slate-200 mt-6">
    Kedai Liliviè &copy; 2026 - Kimi Team Automation
  </footer>

  <!-- SCRIPT LOGIKA -->
  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxg9-ZZG1BzOJOf5_DclT6ziY7Gz6A7N1GJqWbJZI8YSAxuHOvdXAOXFM93mk6kk1bFsQ/exec";

    let teamMembers = [
      "Amelie", "Ami", "Ana", "Novi", "Ann", "Ria", "Dastan", "Desi", "Difarani",
      "Duwi", "Elmira", "Elok", "Endang", "Feni", "Fiafida", "Firanny", "Fdia", "Fitria", "Yani",
      "Irma", "Istidary", "Khariza", "Kholif", "Kyla", "Leha", "Lies", "Linda", "Mahmudah",
      "Mufida", "Ndang", "Novita", "Nurmina", "Puja", "Ratna", "Riri", "Sakucil", "Sanjen",
      "Siros", "Tya", "Udin", "Kim", "Yahya", "Vina", "Zal", "Damis", "Risda", "Niar", "Bila"
    ].map(name => ({ name }));

    let selectedNames = [];

    document.addEventListener("DOMContentLoaded", () => {
      renderNames();
    });

    function renderNames() {
      const container = document.getElementById("nameContainer");
      if (!container) return;
      container.innerHTML = "";

      const sorted = [...teamMembers].sort((a, b) => a.name.localeCompare(b.name, 'id', { sensitivity: 'base' }));

      sorted.forEach(member => {
        const isSelected = selectedNames.includes(member.name);
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `px-2.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1 border ${isSelected
            ? "bg-indigo-600 text-white border-indigo-600 shadow-2xs"
            : "bg-white text-slate-700 border-slate-200 hover:border-slate-300"
          }`;
        btn.innerHTML = isSelected ? `<iconify-icon icon="heroicons:check-20-solid" class="text-xs"></iconify-icon> ${member.name}` : member.name;
        btn.onclick = () => toggleName(member.name);
        container.appendChild(btn);
      });

      const totalEl = document.getElementById("totalSelected");
      if (totalEl) totalEl.innerText = selectedNames.length;
    }

    function toggleName(name) {
      const idx = selectedNames.indexOf(name);
      if (idx > -1) selectedNames.splice(idx, 1);
      else selectedNames.push(name);
      renderNames();
    }

    function selectAll() {
      selectedNames = teamMembers.map(m => m.name);
      renderNames();
    }

    function deselectAll() {
      selectedNames = [];
      renderNames();
    }

    function addName() {
      const input = document.getElementById("newNameInput");
      if (!input) return;
      const val = input.value.trim();
      if (val && !teamMembers.some(m => m.name.toLowerCase() === val.toLowerCase())) {
        teamMembers.push({ name: val });
        selectedNames.push(val);
        input.value = "";
        renderNames();
      }
    }

    function clearAll() {
      selectedNames = [];
      const briefEl = document.getElementById("briefInput");
      const outEl = document.getElementById("outputResult");
      if (briefEl) briefEl.value = "";
      if (outEl) outEl.value = "";
      renderNames();
    }

    // --- LOGIKA UTAMA & PEMBUATAN FOLDER GOOGLE DRIVE OTOMATIS ---
    async function generateJob() {
      const briefEl = document.getElementById("briefInput");
      const folderEl = document.getElementById("folderLinkInput");
      const outEl = document.getElementById("outputResult");
      const modeRadio = document.querySelector('input[name="optionMode"]:checked');
      const mode = modeRadio ? modeRadio.value : "1";
      const btnGenText = document.getElementById("btnGenText");
      const btnGenerate = document.getElementById("btnGenerate");

      if (!briefEl || !outEl) return;
      const rawBrief = briefEl.value.trim();
      const folderLink = folderEl ? folderEl.value.trim() : "";

      if (!rawBrief) return alert("Silakan tempel format brief pesanan terlebih dahulu!");
      if (selectedNames.length === 0) return alert("Pilih minimal satu anggota tim!");

      let rawBlocks = rawBrief
        .split(/(?=ID\s*:\s*\d+)/i)
        .map(b => b.trim())
        .filter(b => b.length > 0 && /ID\s*:/i.test(b));

      if (rawBlocks.length === 0) rawBlocks = [rawBrief];

      let orderIds = [];
      rawBlocks.forEach(block => {
        const idMatch = block.match(/ID\s*:\s*([^\n\r]+)/i);
        if (idMatch) orderIds.push(idMatch[1].trim());
      });

      // Ubah tombol jadi loading
      if (btnGenText) btnGenText.innerText = "Membuat Folder di Google Drive...";
      if (btnGenerate) btnGenerate.disabled = true;

      // Panggil Apps Script otomatis menggunakan metode GET (menembus CORS browser dengan aman)
      if (folderLink && orderIds.length > 0) {
        try {
          const targetUrl = `${GAS_URL}?folderUrl=${encodeURIComponent(folderLink)}&ids=${encodeURIComponent(orderIds.join(","))}`;
          // Menggunakan teknik pemanggilan background via Image/fetch no-cors
          await fetch(targetUrl, { mode: 'no-cors' });
          await new Promise(resolve => setTimeout(resolve, 1200)); // Jeda agar Google Drive selesai membuat folder
        } catch (err) {
          console.error("Gagal membuat folder otomatis:", err);
        }
      }

      if (btnGenText) btnGenText.innerText = "Generate Job & Buat Folder Drive";
      if (btnGenerate) btnGenerate.disabled = false;

      let finalOutput = [];

      if (mode === "1") {
        // --- OPSI 1: SEMUA KEBAGIAN DI SETIAP ID ---
        rawBlocks.forEach((block) => {
          const idMatch = block.match(/ID\s*:\s*([^\n\r]+)/i);
          let orderId = idMatch ? idMatch[1].trim() : "Tanpa_ID";

          let targetReport = folderLink ? `${folderLink.replace(/\/$/, "")}/${orderId}` : "";
          let processedBlock = block;

          if (/Report\s*:/i.test(processedBlock)) {
            if (targetReport) processedBlock = processedBlock.replace(/Report\s*:/i, `Report : ${targetReport}`);
          } else if (targetReport) {
            processedBlock += `\nReport : ${targetReport}`;
          }

          const jumlahMatch = processedBlock.match(/Jumlah\s*:\s*(\d+)/i);
          let totalAmount = jumlahMatch ? parseInt(jumlahMatch[1], 10) : 0;

          let blockResult = processedBlock + "\n\n";

          if (totalAmount > 0 && selectedNames.length > 0) {
            let baseCount = Math.floor(totalAmount / selectedNames.length);
            let remainder = totalAmount % selectedNames.length;

            selectedNames.forEach((name, i) => {
              let assigned = baseCount + (i < remainder ? 1 : 0);
              if (assigned > 0) {
                blockResult += `${i + 1}. ${name} : ${assigned}\n`;
              }
            });
          } else {
            blockResult += `(Jumlah orderan tidak terdeteksi)\n`;
          }

          finalOutput.push(blockResult);
        });

      } else {
        // --- OPSI 2: ROTASI / ORANG BERBEDA PER ID ---
        let memberPointer = 0;

        rawBlocks.forEach((block) => {
          const idMatch = block.match(/ID\s*:\s*([^\n\r]+)/i);
          let orderId = idMatch ? idMatch[1].trim() : "Tanpa_ID";

          let targetReport = folderLink ? `${folderLink.replace(/\/$/, "")}/${orderId}` : "";
          let processedBlock = block;

          if (/Report\s*:/i.test(processedBlock)) {
            if (targetReport) processedBlock = processedBlock.replace(/Report\s*:/i, `Report : ${targetReport}`);
          } else if (targetReport) {
            processedBlock += `\nReport : ${targetReport}`;
          }

          const jumlahMatch = processedBlock.match(/Jumlah\s*:\s*(\d+)/i);
          let totalAmount = jumlahMatch ? parseInt(jumlahMatch[1], 10) : 0;

          let blockResult = processedBlock + "\n\n";

          if (totalAmount > 0 && selectedNames.length > 0) {
            let peopleCountForThisID = Math.min(selectedNames.length, Math.max(1, Math.ceil(totalAmount / 20)));
            let assignedGroup = [];

            for (let i = 0; i < peopleCountForthisID; i++) {
              assignedGroup.push(selectedNames[memberPointer % selectedNames.length]);
              memberPointer++;
            }

            let baseCount = Math.floor(totalAmount / assignedGroup.length);
            let remainder = totalAmount % assignedGroup.length;

            assignedGroup.forEach((name, i) => {
              let assigned = baseCount + (i < remainder ? 1 : 0);
              if (assigned > 0) {
                blockResult += `${i + 1}. ${name} : ${assigned}\n`;
              }
            });
          } else {
            blockResult += `(Jumlah orderan tidak terdeteksi)\n`;
          }

          finalOutput.push(blockResult);
        });
      }

      outEl.value = finalOutput.join("\n﹌﹌﹌﹌﹌﹌﹌﹌\n\n");
    }

    function copyToClipboard() {
      const output = document.getElementById("outputResult");
      if (!output || !output.value.trim()) return alert("Belum ada teks untuk disalin!");
      navigator.clipboard.writeText(output.value).then(() => {
        const btnText = document.getElementById("btnCopyText");
        if (btnText) {
          btnText.innerText = "Berhasil Disalin!";
          setTimeout(() => { btnText.innerText = "Salin Teks Rekapan"; }, 2000);
        }
      });
    }
  </script>
</body>

</html>
